[project]
name = "gerador-senhas"
version = "1.0.0"
description = "Gerador de senhas GTK4/libadwaita integrado ao tema do Omarchy"
requires-python = ">=3.11"
# PyGObject, GTK4 e libadwaita vêm do sistema (pacman), não do PyPI.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
gerador-senhas = "gerador_senhas.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
